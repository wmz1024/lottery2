<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css"/>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body class="mdui-theme-primary-indigo mdui-theme-accent-pink">
  
  <div class="login-container">
    <div class="mdui-card login-card">
      <div class="mdui-card-content">
        <div class="mdui-typo-display-1 mdui-text-center mdui-m-b-3">管理员登录</div>
        
        <div class="mdui-textfield mdui-textfield-floating-label">
          <label class="mdui-textfield-label">用户名</label>
          <input class="mdui-textfield-input" type="text" id="username" onkeypress="if(event.key==='Enter') document.getElementById('password').focus()"/>
        </div>
        
        <div class="mdui-textfield mdui-textfield-floating-label">
          <label class="mdui-textfield-label">密码</label>
          <input class="mdui-textfield-input" type="password" id="password" onkeypress="if(event.key==='Enter') login()"/>
        </div>
        
        <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent mdui-btn-block mdui-m-t-2" onclick="login()">
          登录
        </button>
        
        <div class="mdui-text-center mdui-m-t-2">
          <button class="mdui-btn mdui-btn-icon mdui-ripple" onclick="toggleTheme()" title="切换主题">
            <i class="mdui-icon material-icons" id="themeIcon">brightness_4</i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
