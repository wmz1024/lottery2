<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽奖管理系统 - 管理后台</title>
  <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mdui-theme-primary-indigo mdui-theme-accent-pink mdui-drawer-body-left mdui-appbar-with-toolbar">

  <!-- 侧边栏 -->
  <div class="mdui-drawer" id="main-drawer">
    <div class="mdui-list" mdui-collapse="{accordion: true}">
      <div class="mdui-subheader">管理菜单</div>
      
      <a class="mdui-list-item mdui-ripple active-menu-item" onclick="showPage('lotteries')">
        <i class="mdui-list-item-icon mdui-icon material-icons">card_giftcard</i>
        <div class="mdui-list-item-content">抽奖活动</div>
      </a>
      
      <a class="mdui-list-item mdui-ripple" onclick="showPage('inventory')">
        <i class="mdui-list-item-icon mdui-icon material-icons">inventory</i>
        <div class="mdui-list-item-content">库存管理</div>
      </a>
      
      <a class="mdui-list-item mdui-ripple" onclick="showPage('settings')">
        <i class="mdui-list-item-icon mdui-icon material-icons">settings</i>
        <div class="mdui-list-item-content">系统设置</div>
      </a>
      
      <div class="mdui-divider"></div>
      
      <a class="mdui-list-item mdui-ripple" onclick="logout()">
        <i class="mdui-list-item-icon mdui-icon material-icons">exit_to_app</i>
        <div class="mdui-list-item-content">退出登录</div>
      </a>
    </div>
  </div>

  <!-- 顶部导航栏 -->
  <header class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <button class="mdui-btn mdui-btn-icon mdui-ripple mdui-drawer-toggle" mdui-drawer="{target: '#main-drawer', swipe: true}">
        <i class="mdui-icon material-icons">menu</i>
      </button>
      <span class="mdui-typo-title" id="pageTitle">抽奖活动</span>
      <div class="mdui-toolbar-spacer"></div>
      <button class="mdui-btn mdui-btn-icon mdui-ripple" onclick="toggleTheme()">
        <i class="mdui-icon material-icons" id="themeIcon">brightness_4</i>
      </button>
    </div>
  </header>

  <!-- 主内容 -->
  <div class="mdui-container-fluid" style="padding: 20px;">
    
    <!-- 抽奖活动页面 -->
    <div id="lotteriesPage" class="page-content">
      <div class="row mb-3">
        <div class="col-12">
          <button class="btn btn-primary" onclick="showCreateDialog()">
            <i class="bi bi-plus-circle"></i> 创建抽奖活动
          </button>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="card admin-card">
            <div class="card-body">
              <h5 class="card-title">抽奖活动列表</h5>
              <div class="table-responsive">
                <table class="table table-hover" id="lotteriesTable">
                  <thead>
                    <tr>
                      <th>活动名称</th>
                      <th>描述</th>
                      <th>选项数</th>
                      <th>懦夫选项</th>
                      <th>创建时间</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="lotteriesList">
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 库存管理页面 -->
    <div id="inventoryPage" class="page-content" style="display: none;">
      <div class="row mb-3">
        <div class="col-12">
          <h4>库存管理</h4>
          <p class="text-muted">管理奖品库存和兑换码/卡密</p>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="card admin-card">
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">选择抽奖活动</label>
                <select class="form-select" id="inventoryLotterySelect" onchange="loadInventory()">
                  <option value="">请选择抽奖活动</option>
                </select>
              </div>
              <div id="inventoryContent"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 设置页面 -->
    <div id="settingsPage" class="page-content" style="display: none;">
      <div class="row mb-3">
        <div class="col-12">
          <h4>系统设置</h4>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="card admin-card">
            <div class="card-body">
              <h5 class="card-title">修改管理员账户</h5>
              <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="newUsername" placeholder="新用户名">
              </div>
              <div class="mb-3">
                <label class="form-label">新密码</label>
                <input type="password" class="form-control" id="newPassword" placeholder="留空则不修改">
              </div>
              <div class="mb-3">
                <label class="form-label">确认密码</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入新密码">
              </div>
              <button class="btn btn-primary" onclick="updateAdminAccount()">
                <i class="bi bi-save"></i> 保存修改
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 创建/编辑抽奖对话框 -->
  <div id="lotteryDialog" class="mdui-dialog">
    <div class="mdui-dialog-title" id="dialogTitle">创建抽奖活动</div>
    <div class="mdui-dialog-content">
      <div class="mdui-textfield">
        <label class="mdui-textfield-label">活动名称</label>
        <input class="mdui-textfield-input" type="text" id="lotteryName"/>
      </div>
      <div class="mdui-textfield">
        <label class="mdui-textfield-label">活动描述</label>
        <textarea class="mdui-textfield-input" id="lotteryDesc"></textarea>
      </div>
      <div class="mdui-textfield">
        <label class="mdui-textfield-label">懦夫选项（可选）</label>
        <input class="mdui-textfield-input" type="text" id="cowardOption" placeholder="用户可直接获得此奖项"/>
      </div>
      
      <div class="mdui-typo-subheading mdui-m-t-2">抽奖限制</div>
      <label class="mdui-checkbox mdui-m-t-1">
        <input type="checkbox" id="limitByFingerprint"/>
        <i class="mdui-checkbox-icon"></i>
        每个浏览器指纹只能抽一次
      </label>
      <label class="mdui-checkbox mdui-m-t-1">
        <input type="checkbox" id="limitByIp"/>
        <i class="mdui-checkbox-icon"></i>
        每个IP地址只能抽一次
      </label>
      <label class="mdui-checkbox mdui-m-t-1">
        <input type="checkbox" id="requireEmail"/>
        <i class="mdui-checkbox-icon"></i>
        要求填写联系邮箱
      </label>
      
      <div class="mdui-typo-subheading mdui-m-t-2">抽奖选项</div>
      <div id="optionsList"></div>
      <button class="mdui-btn mdui-btn-outlined mdui-ripple mdui-m-t-1" onclick="addOption()">
        <i class="mdui-icon material-icons">add</i> 添加选项
      </button>
      <div class="mdui-m-t-2">
        <span>总中奖率: <strong id="totalProb">0</strong>%</span>
        <span class="mdui-m-l-2">不中奖率: <strong id="noWinProb">100</strong>%</span>
      </div>
    </div>
    <div class="mdui-dialog-actions">
      <button class="mdui-btn mdui-ripple" mdui-dialog-close>取消</button>
      <button class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="saveLottery()">保存</button>
    </div>
  </div>

  <!-- 抽奖码管理对话框 -->
  <div id="codesDialog" class="mdui-dialog codes-dialog-large">
    <div class="mdui-dialog-title">抽奖码管理</div>
    <div class="mdui-dialog-content">
      <div class="row mb-3">
        <div class="col-md-3">
          <input class="form-control" type="number" id="codeCount" value="10" placeholder="生成数量"/>
        </div>
        <div class="col-md-9">
          <button class="btn btn-primary me-2" onclick="generateCodes()">
            <i class="bi bi-plus-circle"></i> 生成抽奖码
          </button>
          <button class="btn btn-success me-2" onclick="exportCodes()">
            <i class="bi bi-download"></i> 导出CSV
          </button>
          <button class="btn btn-secondary me-2" id="selectAllBtn" onclick="selectAllCodes()">
            全选
          </button>
          <button class="btn btn-warning" onclick="batchSetFixedPrize()">
            <i class="bi bi-magic"></i> 批量设置黑幕
          </button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover">
          <thead>
            <tr>
              <th width="40"><input type="checkbox" class="form-check-input" onclick="selectAllCodes()"></th>
              <th>抽奖码</th>
              <th>状态</th>
              <th>黑幕设置</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="codesList">
          </tbody>
        </table>
      </div>
    </div>
    <div class="mdui-dialog-actions">
      <button class="mdui-btn mdui-ripple" mdui-dialog-close>关闭</button>
    </div>
  </div>

  <!-- 黑幕设置对话框 -->
  <div id="fixedPrizeDialog" class="mdui-dialog">
    <div class="mdui-dialog-title" id="fixedPrizeTitle">设置黑幕</div>
    <div class="mdui-dialog-content">
      <div class="mdui-textfield">
        <label class="mdui-textfield-label">选择奖品</label>
        <select class="mdui-textfield-input" id="fixedPrizeSelect" onchange="onPrizeSelectChange()">
          <option value="">选择奖品</option>
        </select>
      </div>
      
      <div id="rangeOptions" style="display: none;">
        <div class="mdui-typo-caption mdui-m-t-2 mdui-m-b-1">区间奖品设置</div>
        <div class="mdui-textfield">
          <label class="mdui-textfield-label">区间类型</label>
          <select class="mdui-textfield-input" id="rangeType" onchange="onRangeTypeChange()">
            <option value="random">随机（在原区间内随机）</option>
            <option value="specific">指定数值</option>
            <option value="custom">自定义区间</option>
          </select>
        </div>
        
        <div id="specificValueSection" style="display: none;">
          <div class="mdui-textfield">
            <label class="mdui-textfield-label">具体数值</label>
            <input class="mdui-textfield-input" type="number" id="specificValue" step="any"/>
            <span class="mdui-textfield-helper" id="unitDisplay"></span>
          </div>
        </div>
        
        <div id="customRangeSection" style="display: none;">
          <div class="row">
            <div class="col-6">
              <div class="mdui-textfield">
                <label class="mdui-textfield-label">最小值</label>
                <input class="mdui-textfield-input" type="number" id="rangeMin" step="any"/>
              </div>
            </div>
            <div class="col-6">
              <div class="mdui-textfield">
                <label class="mdui-textfield-label">最大值</label>
                <input class="mdui-textfield-input" type="number" id="rangeMax" step="any"/>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mdui-dialog-actions">
      <button class="mdui-btn mdui-ripple" onclick="cancelFixedPrize()">取消</button>
      <button class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="saveFixedPrize()">保存</button>
    </div>
  </div>

  <!-- 抽奖结果对话框 -->
  <div id="resultsDialog" class="mdui-dialog codes-dialog-large">
    <div class="mdui-dialog-title">抽奖结果</div>
    <div class="mdui-dialog-content">
      <button class="btn btn-success mb-3" onclick="exportResults()">
        <i class="bi bi-download"></i> 导出CSV
      </button>
      <div class="table-responsive">
        <table class="table table-sm table-hover">
          <thead>
            <tr>
              <th>抽奖码</th>
              <th>中奖选项</th>
              <th>抽奖时间</th>
              <th>类型</th>
              <th>浏览器指纹</th>
              <th>IP地址</th>
              <th>邮箱</th>
            </tr>
          </thead>
          <tbody id="resultsList">
          </tbody>
        </table>
      </div>
    </div>
    <div class="mdui-dialog-actions">
      <button class="mdui-btn mdui-ripple" mdui-dialog-close>关闭</button>
    </div>
  </div>

  <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
